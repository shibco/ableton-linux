# Wine build for PRs/pushes that touch the Wine build itself, plus a manual
# trigger for checking any other ref on demand:
#
#   gh workflow run ci-pr-build.yml --repo <owner>/ableton-linux --ref <branch>
#
# Relies on this repo's existing "require approval for first-time
# contributors" setting (Settings -> Actions -> General) to gate runs from
# unfamiliar forks - a maintainer approves before it executes, same as any
# other workflow here. Runs with the default pull_request token (read-only,
# no secrets) regardless.
#
# ccache (actions/cache) and a Docker Buildx layer cache (GHA backend) keep
# repeat runs fast - compiled objects and the image's apt/toolchain install,
# respectively. Both keyed loosely (OS-scoped, not ref-scoped), so a new
# branch still reuses whatever any prior run already compiled.
#
# Tarball is attached as a downloadable artifact:
#
#   gh run download <run-id> --repo <owner>/ableton-linux --name wine-build
name: ci-pr-build

# The same path list appears twice (pull_request and push) rather than via a
# YAML anchor: GitHub's workflow parser doesn't support them, so this stays
# boring and duplicated on purpose.
on:
  pull_request:
    paths:
      - patches/**
      - desktop/**
      - Containerfile
      - Makefile
      - VERSION
      - build.sh
      - scripts/**
      - tools/**
      - vendor/**
      - .github/workflows/ci-pr-build.yml
      - .github/workflows/release.yml
  push:
    branches: [main]
    paths:
      - patches/**
      - desktop/**
      - Containerfile
      - Makefile
      - VERSION
      - build.sh
      - scripts/**
      - tools/**
      - vendor/**
      - .github/workflows/ci-pr-build.yml
      - .github/workflows/release.yml
  workflow_dispatch: {}

# A new push to the same PR (or a re-run against main) makes the previous,
# now-stale build pointless; cancel it instead of burning runner minutes on
# both.
concurrency:
  group: ci-pr-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Read runtime version
        id: runtime_version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check pointer safety invariants
        run: make check

      - name: Restore ccache (compiled-object cache, keyed loosely on purpose)
        uses: actions/cache@v6
        with:
          path: .ccache
          # Cache key doesn't need to be exact — ccache hits/misses per object
          # file regardless of key match; restore-keys just gets the closest
          # prior cache as a base instead of starting empty.
          key: ccache-${{ runner.os }}-${{ hashFiles('patches/**', 'Containerfile') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Builds and loads the same image build.sh builds next (same tag), so
      # build.sh's own `docker build` sees a fully cached, no-op rebuild.
      # This is the apt/toolchain layer cache; ccache above is the compiled-
      # object cache. Separate caches because they invalidate on different
      # things: this one on Containerfile, that one on Containerfile *and*
      # patches/**.
      - name: Build container image (Buildx, GHA layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          tags: ableton-wine-build:22.04
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitHub-hosted runners have Docker preinstalled, not podman.
      - name: Build Wine + PipeASIO + ableton-linkd
        run: ENGINE=docker JOBS="$(nproc)" PIPEASIO_TSAN_MODE=require ./build.sh

      # container-build.sh writes dist/ and .ccache/ (mode 600) as the
      # container's user, which under plain `docker run` (unlike rootless
      # podman locally) is actual root — leaves both unreadable by the
      # unprivileged runner user that the later steps (and actions/cache's
      # post-job save) run as.
      - name: Fix ownership of container output (docker runs as root here)
        if: always()
        run: |
          owner="$(id -u):$(id -g)"
          for path in dist .ccache; do
            [ ! -e "$path" ] || sudo chown -R "$owner" "$path"
          done

      # xdg-utils, desktop-file-utils and shared-mime-info carry xdg-mime,
      # update-desktop-database and update-mime-database, which install.sh
      # requires before it will plan or apply the integration component.
      - name: Install installer test requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes cabextract xdg-utils desktop-file-utils shared-mime-info

      - name: Test installer and launcher lifecycle
        run: make test

      # These are properties of the built runtime, so `make test` cannot assert
      # them: its suites are all host-side. The tarball exists by this point, so
      # extract it once and run both gates against it. The resize probe draws,
      # so it needs a display; its suite starts an Xvfb when DISPLAY is unset.
      - name: Test dwrite glyph path and hwnd render target resize
        run: |
          sudo apt-get install --yes gcc-mingw-w64-x86-64 xvfb
          version="$(cat VERSION)"
          rt="$(mktemp -d /tmp/ableton-runtime-gates.XXXXXX)"
          tar --zstd -xf "dist/wine-d2d1-nspa-11.13-$version.tar.zst" -C "$rt"
          make test-glyph-path RUNTIME="$rt/wine-d2d1-nspa-11.13"
          make test-d2d-resize RUNTIME="$rt/wine-d2d1-nspa-11.13"

      # The generic artifact format permits an explicitly recorded no-Qt
      # driver build. The official release image installs Qt, so its artifact
      # must carry the panel binary, desktop entry and icon together, as well
      # as evidence for the no-Qt and sanitizer gates exercised in-container.
      - name: Verify official PipeASIO runtime payload
        run: |
          version="$(cat VERSION)"
          info="dist/BUILD-INFO-$version.txt"
          tarball="dist/wine-d2d1-nspa-11.13-$version.tar.zst"
          probe="dist/pipewire-version-probe"
          test -s "$info"
          test -s "$tarball"
          test -x "$probe"
          grep -Fx 'pipeasio-panel: built' "$info"
          grep -Eq '^pipeasio-settings: [0-9a-f]{64} \(Qt 6\.2 link\)$' "$info"
          grep -Fx 'pipeasio-no-qt: CMake driver build/install + non-integration CTest passed' "$info"
          grep -Fx 'pipeasio-sanitizers: ASan+UBSan unit+panel passed (driver imports verified); TSan unit passed' "$info"
          grep -Fx 'pipewire-version-probe-tests: client-stub+ASan+UBSan passed' "$info"
          probe_hash="$(sed -n 's/^pipewire-version-probe: *//p' "$info")"
          [[ "$probe_hash" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$probe" | awk '{print $1}')" = "$probe_hash"
          inventory="$(mktemp /tmp/pipeasio-runtime-inventory.XXXXXX)"
          tar -I zstd -tf "$tarball" > "$inventory"
          for path in \
              wine-d2d1-nspa-11.13/bin/pipewire-version-probe \
              wine-d2d1-nspa-11.13/bin/pipeasio-settings \
              wine-d2d1-nspa-11.13/share/applications/pipeasio-settings.desktop \
              wine-d2d1-nspa-11.13/share/icons/hicolor/scalable/apps/pipeasio.svg; do
              grep -Fx "$path" "$inventory"
          done
          ./scripts/build-audit.sh "$tarball"

      - name: Build and inspect self-extracting installer
        run: |
          version="$(cat VERSION)"
          ENGINE=docker ./scripts/make-installer.sh
          wrapper="dist/ableton-wine-setup-$version.run"
          test -x "$wrapper"
          test -s "$wrapper.sha256"
          (
            cd dist
            sha256sum -c "$(basename "$wrapper.sha256")"
          )
          extracted="$(mktemp -d /tmp/ableton-installer-ci.XXXXXX)"
          sh "$wrapper" extract "$extracted"
          for path in \
              scripts/setup-realtime.sh \
              scripts/audio-report.sh \
              scripts/rollback.sh \
              bin/pipewire-version-probe; do
              test -x "$extracted/$path"
          done
          cmp -s \
              "dist/BUILD-INFO-$version.txt" \
              "$extracted/BUILD-INFO-$version.txt"
          cmp -s dist/pipewire-version-probe "$extracted/bin/pipewire-version-probe"
          bash "$extracted/scripts/installer.sh" --help >/dev/null

      - name: ccache stats
        if: always()
        continue-on-error: true
        run: docker run --rm -v "$PWD/.ccache:/ccache" -e CCACHE_DIR=/ccache ableton-wine-build:22.04 ccache -s

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wine-build
          path: |
            dist/wine-d2d1-nspa-11.13-*.tar.zst
            dist/wine-d2d1-nspa-11.13-*.tar.zst.sha256
            dist/ableton-wine-setup-*.run
            dist/ableton-wine-setup-*.run.sha256
            dist/ableton-linkd
            dist/pipewire-version-probe
            dist/BUILD-INFO-${{ steps.runtime_version.outputs.version }}.txt
          if-no-files-found: error
          retention-days: 14
